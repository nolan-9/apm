
services:
  mongodb:
    image: mongo:7.0
    container_name: finazon-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    volumes:
      - mercado_simple_data:/data/db

    networks:
      - finazon-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: finazon-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGODB_URI: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/mercado_simple?authSource=admin"
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    ports:
      - "127.0.0.1:4000:4000"

    depends_on:
      - mongodb

    networks:
      - finazon-network

volumes:
  mercado_simple_data:

networks:
  finazon-network:
    driver: bridge
